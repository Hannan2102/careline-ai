# CareLine AI - local development stack.
#
# Only free, local infrastructure lives here. Paid AI providers (OpenAI,
# Deepgram, ElevenLabs) are never containerised: they are external services
# reached through provider adapters, and keeping them out of compose makes it
# impossible to start the stack and accidentally spend money.
#
#   make up          start postgres + hapi-fhir
#   make wait-fhir   block until /fhir/metadata answers
#   make seed        load synthetic data

services:
  postgres:
    image: postgres:16-alpine
    container_name: careline-postgres
    environment:
      POSTGRES_USER: careline
      POSTGRES_PASSWORD: careline
      POSTGRES_DB: careline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careline -d careline"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: careline-hapi-fhir
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # FHIR R4, PostgreSQL-backed. Validation is left permissive for a demo;
      # the adapter validates what actually matters (docs/fhir-data-model.md).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: careline
      SPRING_DATASOURCE_PASSWORD: careline
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: "true"
      HAPI_FHIR_ALLOW_PLACEHOLDER_REFERENCES: "true"
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/fhir/metadata > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  # The backend is normally run on the host with 'make dev' for fast reloads.
  # Start it in Docker with: docker compose --profile full up
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    container_name: careline-backend
    depends_on:
      hapi-fhir:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      EHR_PROVIDER: local
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      DATABASE_URL: postgresql+asyncpg://careline:careline@postgres:5432/careline
      TEXT_ONLY_MODE: "true"
      AI_MODE: mock
    restart: unless-stopped

volumes:
  pgdata:
